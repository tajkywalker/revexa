name: Slimefun Plugin Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      # Note: HytaleServer.jar must be provided via GitHub Secret
      - name: Restore Hytale Server JAR
        run: |
          mkdir -p libs
          echo "${{ secrets.HYTALE_SERVER_JAR_B64 }}" | base64 -d > libs/HytaleServer.jar
        continue-on-error: true

      - name: Build Shadow JAR
        run: ./gradlew shadowJar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aunaria-slimefun-${{ github.sha }}
          path: build/libs/aunaria-slimefun-*.jar
          retention-days: 30

  release:
    name: Attach to Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - run: chmod +x gradlew

      - name: Restore Hytale JAR
        run: |
          mkdir -p libs
          echo "${{ secrets.HYTALE_SERVER_JAR_B64 }}" | base64 -d > libs/HytaleServer.jar

      - name: Build release JAR
        run: ./gradlew shadowJar

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/aunaria-slimefun-*.jar
